name: Update Live Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/badges/**'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch live stats from ORCID, Codeforces, LeetCode, GitHub
        run: node .github/scripts/update-stats.js

      - name: Commit badge data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/
          git diff --cached --quiet || git commit -m "chore: auto-update live stats [skip ci]"
          git push
